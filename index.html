<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Эксперт Новострой — карта разработки сайта</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --panel: #fff;
      --text: #263442;
      --muted: #6d7a87;
      --line: #dce4ea;
      --accent: #5d8aa3;
      --review-bg: #e8f3ff;
      --review-border: #76aee0;
      --review-text: #245f96;
      --published-bg: #e6f6eb;
      --published-border: #74c28e;
      --published-text: #23733d;
      --work-bg: #f0f3f5;
      --work-text: #596673;
      --shadow: 0 12px 34px rgba(35, 52, 67, .08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
    button, input, select { font: inherit; }
    .wrap { width: min(1540px, calc(100% - 40px)); margin: 0 auto; padding: 44px 0 64px; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 28px; }
    h1, h2 { margin: 0; letter-spacing: -.035em; }
    h1 { margin-bottom: 8px; font-size: clamp(32px, 4vw, 50px); line-height: 1.04; }
    h2 { font-size: clamp(25px, 2.5vw, 34px); }
    .subtitle, .updated, .section-copy { color: var(--muted); font-size: 14px; line-height: 1.55; }
    .panel { margin-top: 22px; padding: 22px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: var(--shadow); }
    .architecture-root { display: flex; justify-content: flex-start; margin-bottom: 16px; }
    .architecture-scroll-top { height: 16px; margin-bottom: 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--accent) #e7edf1; }
    .architecture-scroll-top-track { height: 1px; }
    .architecture-scroll { overflow-x: auto; padding: 2px 2px 14px; scrollbar-width: thin; scrollbar-color: var(--accent) #e7edf1; }
    .architecture-scroll-top::-webkit-scrollbar, .architecture-scroll::-webkit-scrollbar { height: 8px; }
    .architecture-scroll-top::-webkit-scrollbar-track, .architecture-scroll::-webkit-scrollbar-track { border-radius: 8px; background: #e7edf1; }
    .architecture-scroll-top::-webkit-scrollbar-thumb, .architecture-scroll::-webkit-scrollbar-thumb { border-radius: 8px; background: var(--accent); }
    .architecture-grid { display: flex; align-items: flex-start; gap: 10px; width: max-content; min-width: 100%; }
    .tree-branch { flex: 0 0 auto; width: max-content; max-width: 240px; }
    .node { display: block; width: max-content; min-width: 120px; max-width: 220px; height: 40px; padding: 5px 9px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: inherit; text-decoration: none; transition: transform .16s ease, box-shadow .16s ease; }
    a.node:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .node.review { border-color: var(--review-border); background: var(--review-bg); }
    .node.published { border-color: var(--published-border); background: var(--published-bg); }
    .node-title, .node-url { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-title { font-size: 12px; line-height: 14px; font-weight: 700; }
    .node-url { color: var(--muted); font-size: 9px; line-height: 12px; }
    .children { position: relative; display: grid; gap: 7px; margin: 7px 0 0 10px; padding-left: 12px; }
    .children:before { position: absolute; top: 0; bottom: 7px; left: 0; width: 1px; background: #cbd5dc; content: ""; }
    .children > .tree-branch { position: relative; }
    .children > .tree-branch:before { position: absolute; top: 20px; left: -12px; width: 12px; height: 1px; background: #cbd5dc; content: ""; }
    .error { padding: 30px 20px; text-align: center; color: #a33737; }
    footer { margin-top: 22px; color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      .top { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 24px); padding-top: 25px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Эксперт Новострой</h1>
        <div class="subtitle">Карта архитектуры, разработки и согласования нового сайта</div>
      </div>
      <div class="updated" id="updated">Обновление данных…</div>
    </header>

    <section class="panel">
      <div id="architecture"></div>
      <div class="error" id="error" hidden>Не удалось загрузить реестр страниц.</div>
    </section>

    <footer>Служебная страница. Не является частью публичного сайта «Эксперт Новострой».</footer>
  </main>

  <script>
    let allPages = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
    }

    function href(page) { return page.preview || ""; }

    function nodeMarkup(page, includeChildren = true) {
      const children = includeChildren ? allPages.filter(item => item.parent === page.url) : [];
      const tag = page.preview ? "a" : "div";
      const link = page.preview ? ` href="${escapeHtml(href(page))}"` : "";
      return `<div class="tree-branch"><${tag} class="node ${escapeHtml(page.status)}"${link}>
        <span class="node-title">${escapeHtml(page.title)}</span>
        <span class="node-url">${escapeHtml(page.url)}</span>
      </${tag}>${children.length ? `<div class="children">${children.map(child => nodeMarkup(child)).join("")}</div>` : ""}</div>`;
    }

    function renderArchitecture() {
      const root = allPages.find(page => page.url === "/");
      const topLevel = allPages.filter(page => page.parent === "/");
      document.querySelector("#architecture").innerHTML = `
        ${root ? `<div class="architecture-root">${nodeMarkup(root, false)}</div>` : ""}
        <div class="architecture-scroll-top" id="architectureScrollTop" tabindex="0" aria-label="Горизонтальная прокрутка карты"><div class="architecture-scroll-top-track" id="architectureScrollTopTrack"></div></div>
        <div class="architecture-scroll" id="architectureScroll"><div class="architecture-grid" id="architectureGrid">${topLevel.map(page => nodeMarkup(page)).join("")}</div></div>`;

      const topScroll = document.querySelector("#architectureScrollTop");
      const bottomScroll = document.querySelector("#architectureScroll");
      const grid = document.querySelector("#architectureGrid");
      const topTrack = document.querySelector("#architectureScrollTopTrack");
      const updateTopTrack = () => { topTrack.style.width = `${grid.scrollWidth}px`; };
      let syncing = false;

      topScroll.addEventListener("scroll", () => {
        if (syncing) return;
        syncing = true;
        bottomScroll.scrollLeft = topScroll.scrollLeft;
        syncing = false;
      }, { passive: true });
      bottomScroll.addEventListener("scroll", () => {
        if (syncing) return;
        syncing = true;
        topScroll.scrollLeft = bottomScroll.scrollLeft;
        syncing = false;
      }, { passive: true });
      updateTopTrack();
      window.addEventListener("resize", updateTopTrack, { passive: true });
    }

    async function init() {
      try {
        const response = await fetch("_review/pages.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        allPages = Array.isArray(data) ? data : (data.pages || []);
        document.querySelector("#updated").textContent = `Реестр обновлён: ${data.updated || "дата не указана"}`;
        renderArchitecture();
      } catch (error) {
        document.querySelector("#error").hidden = false;
        document.querySelector("#updated").textContent = "Ошибка загрузки реестра";
        console.error(error);
      }
    }

    init();
  </script>
</body>
</html>
